<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Initial setup | ACOP Watch</title><link rel="stylesheet" href="auth.css"></head><body data-setup="true"><main class="auth-card"><div class="brand"><div class="brand-mark">AW</div><div><strong>ACOP Watch</strong><span>Pension monitoring</span></div></div><span class="eyebrow">First-time setup</span><h1>Create administrator</h1><p class="auth-copy">Create the first Admin account. This account can later manage branches and users.</p><form class="auth-form" id="authForm"><label>Display name<input name="displayName" required autocomplete="name"></label><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><p class="auth-error" id="authError" role="alert" hidden></p><button class="auth-button" type="submit">Create Admin account</button></form></main><script src="auth.js"></script></body></html>
